name: lril-code-review
description: |
  Matt Pocock's /code-review as a governed run. Reviews the diff since a fixed
  point on two separate axes: Standards (the repo's documented coding standards
  plus a Fowler smell baseline) and Spec (does the change do what the
  originating issue or spec asked?). The axes run as parallel reviewers in fresh
  contexts, so neither pollutes the other. Their reports are kept side by side,
  never merged or reranked. Read-only.

  Use when: you want a branch, PR, or work in progress reviewed against a
  fixed point: "review since main", "review this branch against issue #42".
  NOT for: fixing what it finds (lril-implement and lril-implement-spec do
  that), or reviewing without a fixed point.

provider: claude
model: large
mutates_checkout: false

inputs:
  base:
    default: ""
    description: >-
      The fixed point: a commit SHA, branch, tag, or HEAD~N. The diff is
      `git diff <base>...HEAD`. When empty, the run's base branch is used.
  spec:
    default: ""
    description: >-
      The originating spec: an issue number or URL, or a file path. When empty,
      it is discovered from issue refs in the commits, then a matching
      .scratch/<feature>/spec.md. With none found, the Spec axis reports
      "no spec available".

returns: aggregate

nodes:
  # Fail here, not inside two parallel reviewers: a bad ref or an empty diff is
  # settled by git, and the spec and standards sources are settled by the
  # filesystem and the tracker.
  - id: pin
    script: pin
    runtime: bun
    with:
      base: "$INPUTS.base"
      spec: "$INPUTS.spec"
    output_format:
      type: object
      properties:
        fixed_point: { type: string }
        diff_command: { type: string }
        commit_count: { type: integer }
        spec_path: { type: string }
        spec_source: { type: string }
        standards: { type: array, items: { type: string } }
      required: [fixed_point, diff_command, commit_count, spec_path, spec_source, standards]

  - id: standards
    command: review-standards
    depends_on: [pin]
    context: fresh
    allowed_tools: [Read, Grep, Glob, Bash]
    plugins: [mattpocock-skills@claude-plugins-official]
    skills: [mattpocock-skills:codebase-design]
    output_format:
      type: object
      properties:
        hard_violations: { type: integer }
        judgement_calls: { type: integer }
        worst: { type: string }
      required: [hard_violations, judgement_calls, worst]

  - id: spec-axis
    command: review-spec
    depends_on: [pin]
    when: "$pin.output.spec_path != ''"
    context: fresh
    allowed_tools: [Read, Grep, Glob, Bash]
    output_format:
      type: object
      properties:
        missing: { type: integer }
        scope_creep: { type: integer }
        wrong: { type: integer }
        worst: { type: string }
      required: [missing, scope_creep, wrong, worst]

  # Deterministic aggregation: both reports verbatim under their own headings,
  # one summary line per axis, no cross-axis winner. That separation is the point.
  - id: aggregate
    script: aggregate
    runtime: bun
    depends_on: [pin, standards, spec-axis]
    trigger_rule: none_failed_min_one_success
    with:
      standards: { from: "$standards.output" }
      spec: { from: "$spec-axis.output", if_skipped: null }
    output_format:
      type: object
      properties:
        has_findings: { type: boolean }
        blocking: { type: boolean }
        standards_findings: { type: integer }
        spec_findings: { type: integer }
        summary: { type: string }
      required: [has_findings, blocking, standards_findings, spec_findings, summary]
