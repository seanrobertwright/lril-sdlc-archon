name: lril-implement-spec
description: |
  Matt Pocock's /implement-spec as a governed run. Takes a spec and its tickets
  (from lril-idea-to-tickets or /to-spec plus /to-tickets) and builds the whole
  thing on one integration branch, which is this run's branch. Works the tickets
  as a task graph: each iteration takes the next frontier ticket (all its
  blockers done), builds it test-first in a fresh context, and a deterministic
  gate re-runs the project checks before the ticket counts as done. Then one
  two-axis /code-review over the whole branch, one fix pass, and a PR shaped by
  /pr that closes the spec and its tickets.

  Use when: a multi-ticket spec is ready and you'd rather orchestrate the build
  than drive each ticket: "implement spec #40",
  "build .scratch/saved-cards/spec.md".
  NOT for: a single ticket (lril-implement), or a spec with no tickets yet
  (lril-idea-to-tickets).

provider: claude
model: large

inputs:
  spec:
    default: ""
    description: >-
      The spec: a GitHub issue number or URL, or a .scratch/<feature>/spec.md
      path (or feature slug). When empty, the run's message is the spec.
  pr:
    default: "true"
    description: Open (or update) the integration PR when done, true or false.

returns: outcome
outcome_field: green

nodes:
  - id: load
    script: load-graph
    runtime: bun
    with:
      spec: "$INPUTS.spec"
    output_format:
      type: object
      properties:
        tracker: { type: string, enum: [github, local] }
        spec_ref: { type: string }
        spec_number: { type: integer }
        title: { type: string }
        spec_path: { type: string }
        start_sha: { type: string }
        total: { type: integer }
        open: { type: integer }
      required: [tracker, spec_ref, spec_number, title, spec_path, start_sha, total, open]

  # The exploration subagent of /implement-spec: one read-only pass that leaves
  # notes outside the repo, so each implementer spends its window building.
  - id: explore
    command: explore
    depends_on: [load]
    context: fresh
    model: medium
    allowed_tools: [Read, Grep, Glob, Bash, Write, WebFetch, WebSearch]

  # The task graph, one frontier ticket per iteration, each in a fresh context:
  # the ticket is self-contained, so the last one's context is disposable. Run
  # state lives in the artifacts, so a failure resume continues at the open ticket.
  - id: build
    depends_on: [explore]
    loop_group:
      fresh_context: true
      max_iterations: 60
      until_bash: 'test $next.output.all_done = true'
      nodes:
        - id: next
          script: next-ticket
          runtime: bun
          output_format:
            type: object
            properties:
              all_done: { type: boolean }
              key: { type: string }
              ref: { type: string }
              title: { type: string }
              head_sha: { type: string }
            required: [all_done, key, ref, title, head_sha]

        - id: impl
          command: implement-ticket
          depends_on: [next]
          when: "$next.output.all_done == false"
          plugins: [mattpocock-skills@mattpocock]
          skills: [mattpocock-skills:tdd, mattpocock-skills:codebase-design]
          output_format:
            type: object
            properties:
              done: { type: boolean }
              green: { type: boolean }
              summary: { type: string }
              check_commands: { type: array, items: { type: string } }
            required: [done, green, summary, check_commands]

        - id: ticket-gate
          script: ticket-gate
          runtime: bun
          # Above the per-command limits in .shared/checks.ts and .shared/loop.ts; Archon's default is 120 s.
          timeout: 3600000
          depends_on: [next, impl]
          with:
            verdict: { from: "$impl.output" }
            key: "$next.output.key"
            head_sha: "$next.output.head_sha"
          output_format:
            type: object
            properties:
              key: { type: string }
              remaining: { type: integer }
            required: [key, remaining]

  - id: review
    include: lril-code-review
    depends_on: [build]
    with:
      base: "$load.output.start_sha"
      spec: "$load.output.spec_path"

  # /implement-spec: "Fix all issues raised by the code review in a single
  # implementer subagent."
  - id: fix
    command: fix-review
    depends_on: [review]
    when: "$review.output.has_findings == true"
    context: fresh
    with:
      review_summary: "$review.output.summary"
    plugins: [mattpocock-skills@mattpocock]
    skills: [mattpocock-skills:tdd, mattpocock-skills:codebase-design]
    output_format:
      type: object
      properties:
        done: { type: boolean }
        green: { type: boolean }
        summary: { type: string }
        check_commands: { type: array, items: { type: string } }
      required: [done, green, summary, check_commands]

  - id: recheck
    script: gate
    runtime: bun
    # Above the per-command limits in .shared/checks.ts and .shared/loop.ts; Archon's default is 120 s.
    timeout: 3600000
    depends_on: [fix]
    with:
      verdict: { from: "$fix.output" }
      start_sha: "$load.output.start_sha"
      label: after-review

  - id: pr-body
    command: pr-body
    depends_on: [review, recheck]
    trigger_rule: none_failed_min_one_success
    when: "$INPUTS.pr == 'true'"
    context: fresh
    plugins: [mattpocock-skills@mattpocock]
    skills: [mattpocock-skills:pr]
    output_format:
      type: object
      properties:
        title: { type: string }
      required: [title]

  - id: publish-pr
    script: publish-pr
    runtime: bun
    depends_on: [pr-body]
    with:
      title: "$pr-body.output.title"
    output_format:
      type: object
      properties:
        pr_url: { type: string }
      required: [pr_url]

  - id: outcome
    script: outcome
    runtime: bun
    depends_on: [review, recheck, publish-pr]
    trigger_rule: none_failed_min_one_success
    with:
      title: "$load.output.title"
      spec_ref: "$load.output.spec_ref"
      total: "$load.output.total"
      review: "$review.output.summary"
      pr_url: { from: "$publish-pr.output.pr_url", if_skipped: null }
    output_format:
      type: object
      properties:
        green: { type: boolean }
        summary: { type: string }
      required: [green, summary]
